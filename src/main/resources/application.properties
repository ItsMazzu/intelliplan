spring.application.name=IntelliPlan
spring.config.import=optional:file:${INTELLIPLAN_CONFIG_FILE:${user.home}/.intelliplan/application.properties}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/intelliplan}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
