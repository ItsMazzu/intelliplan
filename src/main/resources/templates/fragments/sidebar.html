<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(ativo)" class="sidebar flex w-full flex-col text-white lg:fixed lg:inset-y-0 lg:w-[216px]">
  <a th:href="@{/}" class="flex items-center gap-3 px-6 py-7">
    <span class="brand-mark"><i data-lucide="sparkle" class="h-7 w-7"></i></span>
    <span class="text-xl font-extrabold tracking-tight">IntelliPlan</span>
  </a>

  <nav class="flex gap-1 overflow-x-auto px-3 pb-4 lg:flex-col lg:overflow-visible" aria-label="Navegação principal">
    <a th:href="@{/dashboard}" href="/dashboard" class="nav-link" th:classappend="${ativo == 'dashboard'} ? ' active' : ''"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
    <a th:href="@{/tarefas}" href="/tarefas" class="nav-link" th:classappend="${ativo == 'tarefas'} ? ' active' : ''"><i data-lucide="square-check-big"></i><span>Tarefas</span></a>
    <a th:href="@{/projetos}" href="/projetos" class="nav-link" th:classappend="${ativo == 'projetos'} ? ' active' : ''"><i data-lucide="folder"></i><span>Projetos</span></a>
    <a th:href="@{/estudos}" href="/estudos" class="nav-link" th:classappend="${ativo == 'estudos'} ? ' active' : ''"><i data-lucide="book-open"></i><span>Estudos</span></a>
    <a th:href="@{/agenda}" href="/agenda" class="nav-link" th:classappend="${ativo == 'agenda'} ? ' active' : ''"><i data-lucide="calendar-days"></i><span>Agenda</span></a>
    <a th:href="@{/habitos}" href="/habitos" class="nav-link" th:classappend="${ativo == 'habitos'} ? ' active' : ''"><i data-lucide="heart"></i><span>Hábitos</span></a>
  </nav>

  <div class="mx-5 my-4 hidden border-t border-white/15 lg:block"></div>

  <!-- Card 1 com a arte do gatinho -->
  <div class="sidebar-note mx-4 mb-5 mt-auto hidden rounded-2xl p-5 lg:block" aria-label="Card motivacional"></div>

  <div class="mt-auto flex items-center justify-between border-t border-white/10 px-5 py-5">
    <div class="flex min-w-0 items-center gap-3">
      <div class="avatar">LC</div>
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold" th:text="${usuarioNome} ?: 'Laís Campos'">Laís Campos</p>
        <p class="text-xs text-purple-200/70">Meu espaço</p>
      </div>
    </div>
    <a th:href="@{/configuracoes}" href="/configuracoes" aria-label="Configurações"><i data-lucide="settings" class="h-5 w-5 text-purple-200"></i></a>
  </div>
</aside>

</body>
</html>
