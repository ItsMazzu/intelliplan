<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${modoEdicao} ? 'IntelliPlan | Editar Conteúdo' : 'IntelliPlan | Novo Conteúdo'">IntelliPlan | Estudos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/base/customstyles.css}" href="/css/base/customstyles.css">
  <link rel="stylesheet" th:href="@{/css/pages/dashboard.css}" href="/css/pages/dashboard.css">
  <link rel="stylesheet" th:href="@{/css/pages/modules.css}" href="/css/pages/modules.css">
</head>
<body class="min-h-screen bg-mist text-ink">
<div class="min-h-screen lg:flex">
  <div th:replace="~{fragments/sidebar :: sidebar('estudos')}"></div>
  <main class="module-main">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div class="module-content">
      <div class="page-heading"><div><h1 th:text="${modoEdicao} ? 'Editar conteúdo' : 'Novo conteúdo'">Conteúdo</h1><p th:text="'Matéria: ' + ${materia.nome}">Matéria</p></div></div>
      <section class="content-panel form-panel">
        <div class="panel-heading"><h2><i data-lucide="book-open"></i>Dados do conteúdo</h2></div>
        <form th:action="${modoEdicao} ? @{/estudos/{materiaId}/conteudos/{conteudoId}/editar(materiaId=${materiaId},conteudoId=${conteudoId})} : @{/estudos/{materiaId}/conteudos(materiaId=${materiaId})}"
              th:object="${conteudoForm}" method="post" data-validate class="form-body">
          <div class="form-grid">
            <div class="form-field full">
              <label for="titulo">Título *</label>
              <input id="titulo" th:field="*{titulo}" required maxlength="300" placeholder="Título do conteúdo">
              <p th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" class="validation-error"></p>
            </div>
            <div class="form-field full">
              <label for="descricao">Descrição</label>
              <textarea id="descricao" th:field="*{descricao}" placeholder="Observações sobre o conteúdo"></textarea>
            </div>
            <div class="form-field">
              <label for="status">Status *</label>
              <select id="status" th:field="*{status}" required>
                <option th:each="status : ${statusOpcoes}" th:value="${status}" th:text="${status}"></option>
              </select>
            </div>
            <input type="hidden" th:field="*{materiaId}">
          </div>
          <div class="form-actions">
            <a th:href="@{/estudos/{materiaId}(materiaId=${materiaId})}" class="secondary-button">Cancelar</a>
            <button type="submit" class="primary-button"><i data-lucide="check"></i><span th:text="${modoEdicao} ? 'Salvar alterações' : 'Criar conteúdo'"></span></button>
          </div>
        </form>
      </section>
    </div>
  </main>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script th:src="@{/js/components/modules.js}" src="/js/components/modules.js"></script>
</body>
</html>
